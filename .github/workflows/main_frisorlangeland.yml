# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - frisorlangeland

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: dotnet publish
        run: dotnet publish -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    env:
      # True only when the SALON_ADMIN_PASSWORD repository secret exists (secrets cannot be tested in a step's if:).
      HAS_ADMIN_PASSWORD: ${{ secrets.SALON_ADMIN_PASSWORD != '' }}
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0266321F03A24C5DB359DE531A78568D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_185B63EAC8894332B71C2C6ABE4950CE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9D8E4EAA1DCB444DAD7FDB0431357D54 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'frisorlangeland'
          slot-name: 'Production'
          package: .

      # Optional: lets the admin account be created without opening the Azure portal.
      # Add a repository secret named SALON_ADMIN_PASSWORD (Settings > Secrets and variables > Actions).
      # It is copied to the app setting Salon__AdminPassword; on the app's next start the seeder
      # creates the admin user if there is none yet. It never changes the password of an existing admin.
      - name: Set the admin password app setting
        if: ${{ env.HAS_ADMIN_PASSWORD == 'true' }}
        continue-on-error: true
        env:
          SALON_ADMIN_PASSWORD: ${{ secrets.SALON_ADMIN_PASSWORD }}
        run: |
          group=$(az webapp list --query "[?name=='frisorlangeland'].resourceGroup | [0]" -o tsv)
          if [ -z "$group" ]; then
            echo "::warning::Could not find the web app 'frisorlangeland' with this Azure login, so the admin password setting was not changed."
            exit 1
          fi
          current=$(az webapp config appsettings list --name frisorlangeland --resource-group "$group" --query "[?name=='Salon__AdminPassword'].value | [0]" -o tsv)
          if [ "$current" = "$SALON_ADMIN_PASSWORD" ]; then
            echo "Salon__AdminPassword is already set to this value; nothing to do."
          else
            az webapp config appsettings set --name frisorlangeland --resource-group "$group" --settings "Salon__AdminPassword=$SALON_ADMIN_PASSWORD" --output none
            echo "Salon__AdminPassword updated; the app restarts and creates the admin account if it does not exist yet."
          fi
          
          